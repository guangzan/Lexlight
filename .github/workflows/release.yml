name: Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate package and tag versions
        run: bash scripts/verify-release.sh "$GITHUB_REF_NAME"

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
